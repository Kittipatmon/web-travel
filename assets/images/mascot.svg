<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Filter for soft drop shadow -->
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="inner-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cheeksGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Backpack behind body -->
    <rect x="42" y="105" width="22" height="42" rx="10" fill="#ea580c" />
    <rect x="44" y="112" width="18" height="20" rx="6" fill="#f97316" />
    <circle cx="53" cy="122" r="3" fill="#ffffff" opacity="0.8" />

    <!-- Feet / Shoes (Rounded cute brown explorer boots) -->
    <!-- Left foot -->
    <ellipse cx="78" cy="192" rx="16" ry="10" fill="#78350f" />
    <ellipse cx="78" cy="190" rx="13" ry="7" fill="#92400e" />
    <rect x="70" y="196" width="16" height="4" rx="2" fill="#451a03" />

    <!-- Right foot -->
    <ellipse cx="122" cy="192" rx="16" ry="10" fill="#78350f" />
    <ellipse cx="122" cy="190" rx="13" ry="7" fill="#92400e" />
    <rect x="114" y="196" width="16" height="4" rx="2" fill="#451a03" />

    <!-- Cute Body (Pear/chubby round shape) -->
    <path d="M60,115 C55,80 80,68 100,68 C120,68 145,80 140,115 C146,135 148,160 135,178 C125,190 75,190 65,178 C52,160 54,135 60,115 Z" fill="url(#bodyGrad)" />

    <!-- Soft Cream/White Belly -->
    <path d="M74,125 C72,105 85,96 100,96 C115,96 128,105 126,125 C128,145 125,172 100,172 C75,172 72,145 74,125 Z" fill="url(#bellyGrad)" opacity="0.95" />

    <!-- Little Tail or side detail -->
    <!-- Left Hand (holding camera strap) -->
    <path d="M58,125 Q45,135 52,148 Q60,152 66,138 Z" fill="url(#bodyGrad)" />

    <!-- Hanging Camera around neck -->
    <!-- Neck Strap -->
    <path d="M82,108 Q100,132 118,108" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <!-- Camera Body -->
    <rect x="85" y="132" width="30" height="22" rx="5" fill="#1e293b" />
    <rect x="88" y="129" width="8" height="4" rx="1.5" fill="#f59e0b" />
    <!-- Camera Lens with reflection -->
    <circle cx="100" cy="143" r="8" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="98" cy="141" r="2.5" fill="#ffffff" opacity="0.8" />
    <!-- Small camera flash dot -->
    <circle cx="110" cy="136" r="1.5" fill="#ef4444" />

    <!-- Cheerful Face Features -->
    <!-- Blush Cheeks -->
    <ellipse cx="76" cy="116" rx="6.5" ry="4" fill="url(#cheeksGrad)" opacity="0.85" />
    <ellipse cx="124" cy="116" rx="6.5" ry="4" fill="url(#cheeksGrad)" opacity="0.85" />

    <!-- Big Sparkly Eyes -->
    <!-- Left Eye -->
    <ellipse cx="85" cy="107" rx="7" ry="9" fill="#0f172a" />
    <circle cx="83" cy="104" r="3" fill="#ffffff" />
    <circle cx="87" cy="111" r="1.2" fill="#ffffff" />
    <!-- Right Eye (winking or happy bright eye) -->
    <ellipse cx="115" cy="107" rx="7" ry="9" fill="#0f172a" />
    <circle cx="113" cy="104" r="3" fill="#ffffff" />
    <circle cx="117" cy="111" r="1.2" fill="#ffffff" />

    <!-- Cute Smiling Mouth with tongue -->
    <path d="M93,115 Q100,125 107,115" fill="#991b1b" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M96,119 Q100,124 104,119" fill="#f43f5e" />

    <!-- Right Hand (Waving excitedly to the user!) -->
    <!-- Upper arm -->
    <path d="M136,120 Q155,108 160,90 Q152,82 138,98 Q132,108 136,120 Z" fill="url(#bodyGrad)" />
    <!-- Cute Waving Hand Paw with 3 tiny fingers -->
    <circle cx="158" cy="87" r="7.5" fill="#38bdf8" />
    <circle cx="163" cy="82" r="3" fill="#38bdf8" />
    <circle cx="158" cy="78" r="3" fill="#38bdf8" />
    <circle cx="153" cy="81" r="3" fill="#38bdf8" />

    <!-- Explorer / Safari Hat (Pith Hat style with red band) -->
    <!-- Hat Crown -->
    <path d="M72,66 C72,42 85,32 100,32 C115,32 128,42 128,66 Z" fill="url(#hatGrad)" />
    <!-- Hat Top Button / Vent -->
    <ellipse cx="100" cy="32" rx="5" ry="2" fill="#78350f" />
    <!-- Red Accent Band -->
    <path d="M73,63 C80,60 120,60 127,63 L128,68 C120,65 80,65 72,68 Z" fill="url(#bandGrad)" />
    <!-- Small Leaf / Compass Badge on hat band -->
    <circle cx="100" cy="65" r="4" fill="#ffffff" stroke="#d97706" stroke-width="1" />
    <path d="M100,62 L101.5,65 L100,68 L98.5,65 Z" fill="#ef4444" />
    <!-- Hat Brim (Curved 3D round brim) -->
    <ellipse cx="100" cy="68" rx="38" ry="11" fill="url(#hatGrad)" stroke="#b45309" stroke-width="1.5" />
    <ellipse cx="100" cy="67" rx="34" ry="8" fill="#fbbf24" opacity="0.4" />

    <!-- Friendly sparkles around mascot -->
    <g fill="#f59e0b" opacity="0.85">
      <path d="M168,60 Q170,65 175,67 Q170,69 168,74 Q166,69 161,67 Q166,65 168,60 Z" />
      <path d="M38,82 Q39,85 43,86 Q39,87 38,91 Q37,87 33,86 Q37,85 38,82 Z" />
    </g>
  </g>
</svg>

